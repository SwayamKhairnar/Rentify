services:
  postgres:
    image: postgres:16-alpine
    container_name: rentify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rentify
      DB_USER: postgres
      DB_PASS: password123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-rentify-cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-demo-api-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-demo-api-secret}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
